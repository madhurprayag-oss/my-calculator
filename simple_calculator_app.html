<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ultimate Scientific Calculator Pro MAX (CAS)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">

<script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.min.js"></script>

<style>
:root{--bg:#1e1e1e;--calc:#2c2c2c;--text:#fff;--btn:#444;--accent:#ff9500;--equal:#28a745}
body.light{--bg:#f4f4f4;--calc:#fff;--text:#000;--btn:#ddd}
body{margin:0;background:var(--bg);font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.app{width:100%;max-width:420px;background:var(--calc);padding:12px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.4)}
button{border:none;border-radius:10px;padding:14px;font-size:16px;background:var(--btn);color:var(--text);cursor:pointer;transition:transform .08s ease,background .2s ease}
button:active{transform:scale(0.93)}
.display{width:100%;height:60px;font-size:22px;text-align:right;padding:10px;border-radius:10px;background:#000;color:#0f0;margin-bottom:10px}
.grid{display:grid;grid-template-columns:60px repeat(4,1fr);gap:8px}
.op{background:var(--accent)}
.eq{background:var(--equal)}
.history{background:#111;color:#0f0;padding:8px;border-radius:8px;margin-top:8px;font-size:13px}
.compact .display{height:48px;font-size:18px}
.compact button{padding:10px;font-size:14px}
@media(max-width:480px){.app{max-width:100%;border-radius:0}.grid{gap:6px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;gap:6px;margin-bottom:6px">
    <button onclick="toggleTheme()">🌙</button>
    <button onclick="toggleAngle()" id="angleBtn">Deg</button>
    
    <button onclick="clearHistory()">🗑</button>
    <button onclick="toggleMode()" id="modeBtn">Scientific</button>
  </div>

  <input id="display" class="display" disabled />

  <div class="grid" id="calculatorGrid">
    <!-- OPERATORS ROW -->
    <button class="op" onclick="append('/')">÷</button>
    <button class="op" onclick="append('*')">×</button>
    <button class="op" onclick="append('-')">−</button>
    <button class="op" onclick="append('+')">+</button>
    <button class="eq" onclick="calculate()">=</button>

    <!-- FUNCTION ROW -->
    <button onclick="clearDisplay()">C</button>
    <button onclick="backspace()">⌫</button>
    <button onclick="memoryAdd()">M+</button>
    <button onclick="memorySub()">M-</button>
    <button onclick="memoryRecall()">MR</button>

    <!-- SCIENTIFIC -->
    <button onclick="calcTrig('sin')">sin</button>
    <button onclick="calcTrig('cos')">cos</button>
    <button onclick="calcTrig('tan')">tan</button>
    <button onclick="calc('log10')">log</button>
    <button onclick="calc('log')">ln</button>

    <button onclick="calc('sqrt')">√</button>
    <button onclick="calcFactorial()">x!</button>
    <button onclick="append('pi')">π</button>
    <button onclick="append('^')">xʸ</button>

    <!-- NUMBERS -->
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
  </div>

  <div class="history" id="history"></div>
</div>

<script>
const display = document.getElementById('display');
const historyBox = document.getElementById('history');
const app = document.getElementById('app');
let degree = true;
let memory = 0;
let isScientific = true;

function append(v){ display.value += v; }
function clearDisplay(){ display.value = ''; }
function backspace(){ display.value = display.value.slice(0,-1); }

function toggleMode(){
  const grid = document.getElementById('calculatorGrid');
  const btn = document.getElementById('modeBtn');
  const buttons = [...grid.children];

  isScientific = !isScientific;

  if (!isScientific) {
    btn.innerText = 'Normal';
    app.classList.add('compact');
    buttons.forEach(b => {
      const t = b.textContent;
      const show = /^[0-9.]$/.test(t) || ['+','−','×','÷','=','C','⌫'].includes(t);
      b.style.display = show ? 'block' : 'none';
    });
  } else {
    btn.innerText = 'Scientific';
    app.classList.remove('compact');
    buttons.forEach(b => b.style.display = 'block');
  }
}

function calculate(){
  try{
    const res = math.evaluate(display.value);
    save(display.value + ' = ' + res);
    display.value = res;
  } catch { alert('Invalid Expression'); }
}

function calc(fn){
  try{
    const expr = fn + '(' + display.value + ')';
    const res = math.evaluate(expr);
    save(expr + ' = ' + res);
    display.value = res;
  } catch { alert('Invalid Expression'); }
}

function calcTrig(fn){
  try{
    let val = parseFloat(display.value);
    if (degree) val = val * Math.PI / 180;
    const res = Math[fn](val);
    save(fn + '(' + display.value + ') = ' + res);
    display.value = res;
  } catch { alert('Invalid Expression'); }
}

function calcFactorial(){
  try{
    const n = parseInt(display.value);
    if (n < 0) throw '';
    let r = 1;
    for (let i = 1; i <= n; i++) r *= i;
    save(n + '! = ' + r);
    display.value = r;
  } catch { alert('Invalid Expression'); }
}

function memoryAdd(){ memory += Number(display.value||0); }
function memorySub(){ memory -= Number(display.value||0); }
function memoryRecall(){ display.value = memory; }

function save(v){
  const h = JSON.parse(localStorage.getItem('history') || '[]');
  h.unshift(v);
  localStorage.setItem('history', JSON.stringify(h.slice(0,40)));
  renderHistory();
}

function renderHistory(){
  historyBox.innerHTML = '';
  (JSON.parse(localStorage.getItem('history')) || []).forEach(x => {
    const d = document.createElement('div');
    d.textContent = x;
    historyBox.appendChild(d);
  });
}

function clearHistory(){ localStorage.removeItem('history'); renderHistory(); }

function toggleTheme(){ document.body.classList.toggle('light'); }
function toggleAngle(){ degree = !degree; document.getElementById('angleBtn').innerText = degree ? 'Deg' : 'Rad'; }



console.assert(typeof toggleMode === 'function');
console.assert(typeof calculate === 'function');

renderHistory();
</script>
</body>
</html>
